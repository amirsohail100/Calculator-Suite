<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div id="expr" class="expr"></div>
    <div id="result" class="result">0</div>
    <div class="keys">
      <button data-action="clear" class="fn">C</button>
      <button data-action="back" class="fn">⌫</button>
      <button data-value="(" class="fn">(</button>
      <button data-value=")" class="fn">)</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="/" class="op">÷</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="*" class="op">×</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="-" class="op">−</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-action="equals" class="eq">=</button>
      <button data-value="+" class="op">+</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
